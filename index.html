<!DOCTYPE html>
<html>
<head>
  <!--
    If deploying to GitHub Pages repository (e.g. https://AhmedAliCoder.github.io/portfolio/),
    set href="/portfolio/". If deploying to root domain (https://AhmedAliCoder.github.io/), set href="/".
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal portfolio website of Ahmed Ali, BSIT student and Flutter developer specializing in mobile app development, Dart, and PostgreSQL.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Ali Portfolio">
  
  <title>Ahmed Ali | Flutter Developer & BSIT Student</title>

  <style>
    body {
      margin: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #0f172a;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-weight: 500; font-size: 15px;">Loading Ahmed Ali's Portfolio...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
